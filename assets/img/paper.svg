<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Cold-pressed watercolour paper tooth. -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="9" stitchTiles="stitch" result="t"/>
    <feDiffuseLighting in="t" surfaceScale="1.4" lighting-color="#fffaf0" result="l"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
    <feColorMatrix in="l" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  -0.6 0 0 0 0.62"/>
  </filter>
  <rect width="300" height="300" filter="url(#p)"/>
</svg>
